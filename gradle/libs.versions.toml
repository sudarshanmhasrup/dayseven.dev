[versions]
# Library and plugin versions
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"

# desktop module's configuration information
desktop-group = "dev.dayseven.app"
desktop-version = "1.0.0"
desktop-mainClass = "dev.dayseven.app.AppKt"
desktop-packageOfResClass = "dev.dayseven.app.desktop.resources"

[libraries]

[bundles]

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }