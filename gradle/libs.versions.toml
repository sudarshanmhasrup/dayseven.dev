[versions]
# Library and plugin versions
kotlin = "2.4.10"
androidGradlePlugin = "9.3.1"
composeMultiplatform = "1.11.1"

# desktop module's configuration information
desktop-group = "dev.dayseven.app"
desktop-version = "1.0.0"
desktop-mainClass = "dev.dayseven.app.AppKt"
desktop-packageOfResClass = "dev.dayseven.app.desktop.resources"

# desktop module's distribution information
desktop-distributionPackageName = "DaySeven"
desktop-distributionPackageVersion = "26.0.0"

[libraries]

[bundles]

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }